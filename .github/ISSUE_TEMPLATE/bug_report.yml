name: Bug report
description: Report a problem with the application
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide enough information to reproduce the problem.

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Tell us the steps needed to reproduce the problem.
      placeholder: |
        1. Go to...
        2. Click...
        3. See...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 149

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11

  - type: dropdown
    id: database
    attributes:
      label: Is the database connected?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
